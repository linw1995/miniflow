[package]
name = "mf-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime contracts and execution support for miniflow"

[features]
default = []
async = ["dep:futures", "dep:futures-timer"]
tokio = ["async", "dep:tokio"]

[dependencies]
# Workflow observation contracts.
mf-telemetry.workspace = true
opentelemetry.workspace = true

# Node registration and persistent execution state.
inventory.workspace = true
rpds.workspace = true

# Runner argument parsing, runtime values, and error reporting.
clap = { workspace = true, features = ["string"] }
mf-runtime-derive.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
snafu.workspace = true

# Future driving is independent of the optional native reactor.
futures = { workspace = true, features = ["std", "executor"], optional = true }
futures-timer = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"], optional = true }

[target.'cfg(unix)'.dependencies]
# Streaming standard I/O redirection and polling.
libc.workspace = true

# Standalone runner signal forwarding.
signal-hook.workspace = true

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["logs", "trace", "testing"] }
tempfile.workspace = true
