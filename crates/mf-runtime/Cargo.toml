[package]
name = "mf-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime contracts and execution support for miniflow"

[dependencies]
# Workflow observation contracts.
mf-telemetry.workspace = true

# Node registration and persistent snapshot state.
inventory.workspace = true
rpds.workspace = true

# Runtime values and error reporting.
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
snafu.workspace = true

[target.'cfg(unix)'.dependencies]
# Streaming standard I/O redirection and polling.
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
