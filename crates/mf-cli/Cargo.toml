[package]
name = "mf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Compile declarative workflows into native executables"

[[bin]]
name = "mf"
path = "src/main.rs"

[features]
development-support = []

[dependencies]
# Workflow compilation and terminal observation.
mf-compiler = { workspace = true, features = ["codegen"] }
mf-runtime.workspace = true
mf-tui.workspace = true
mf-chat.workspace = true

# Command parsing and error reporting.
clap = { workspace = true, features = ["derive"] }
snafu.workspace = true

[dev-dependencies]
# Chat persistence assertions and model fixtures.
diesel = { workspace = true, features = ["sqlite"] }
mfn-deepseek = { workspace = true, features = ["test-support"] }
mfn-llm = { workspace = true, features = ["test-support"] }

# Package fixtures and artifact verification.
flate2.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true

# Pseudo-terminal integration tests and embedded manifest fixtures.
nix = { workspace = true, features = ["fs", "term"] }

# OTLP export assertions.
mf-telemetry = { workspace = true, features = ["otlp"] }
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "logs", "trace"] }
prost.workspace = true
