[package]
name = "mf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Compile declarative workflows into native executables"

[[bin]]
name = "mf"
path = "src/main.rs"

[features]
development-support = []

[dependencies]
mf-compiler.workspace = true
mf-tui.workspace = true
snafu = "0.9.2"

[dev-dependencies]
flate2 = "1.1.10"
mf-telemetry = { workspace = true, features = ["otlp"] }
nix = { version = "0.31.3", features = ["fs", "term"] }
opentelemetry-proto = { version = "0.33.0", default-features = false, features = ["gen-tonic-messages", "logs", "trace"] }
prost = "0.14.4"
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
