[package]
name = "fixture-multi-nodes"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Tests copy this standalone fixture outside the main workspace.
[workspace]

[features]
default = []
double = []
fail-execution = []
duplicate-kind = []

[dependencies]
# Keep explicit versions for standalone builds, aligned with the root manifest.

# Test node contracts and registration.
inventory = "0.3.24"
mf-runtime = { path = "../../../../mf-runtime", version = "0.1.0" }

# Test node configuration and values.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
