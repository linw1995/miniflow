[package]
name = "mf-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Workflow validation and native code generation for miniflow"

[features]
default = ["codegen"]
codegen = ["dep:prettyplease", "dep:proc-macro2", "dep:quote", "dep:syn"]

[[example]]
name = "benchmark_graph"
required-features = ["codegen"]

[dependencies]
# Runtime contracts and workflow observation.
mf-runtime.workspace = true
mf-telemetry.workspace = true

# Rust source generation, enabled by the codegen feature.
prettyplease = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
syn = { workspace = true, features = ["full", "parsing", "printing"], optional = true }

# Workflow definitions, compiled plans, and diagnostics.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
snafu.workspace = true

[dev-dependencies]
# Built-in nodes and test node registration.
inventory.workspace = true
mfn-code.workspace = true
mfn-core.workspace = true

# Observation assertions and tracing examples.
opentelemetry = { workspace = true, features = ["logs", "trace"] }
opentelemetry_sdk = { workspace = true, features = ["logs", "trace", "testing"] }

# Isolated generated projects and build artifacts.
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# Named pipe fixtures for source cancellation regressions.
nix = { workspace = true, features = ["fs"] }
