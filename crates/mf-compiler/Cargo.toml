[package]
name = "mf-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Workflow validation and native code generation for miniflow"

[dependencies]
mf-runtime.workspace = true
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snafu = "0.9.2"
syn = { version = "3.0.6", default-features = false, features = ["full", "parsing", "printing"] }

[dev-dependencies]
inventory = "0.3.24"
tempfile = "3.27.0"
