[package]
name = "mf-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Workflow validation and native code generation for miniflow"

[features]
default = ["codegen"]
codegen = ["dep:prettyplease", "dep:proc-macro2", "dep:quote", "dep:syn"]

[[example]]
name = "benchmark_graph"
required-features = ["codegen"]

[dependencies]
mf-runtime.workspace = true
mf-telemetry.workspace = true
prettyplease = { version = "0.3.0", optional = true }
proc-macro2 = { version = "1.0.107", optional = true }
quote = { version = "1.0.47", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snafu = "0.9.2"
syn = { version = "3.0.6", default-features = false, features = ["full", "parsing", "printing"], optional = true }

[dev-dependencies]
opentelemetry = { version = "0.33.0", default-features = false, features = ["logs", "trace"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["logs", "trace", "testing"] }
mfn-core.workspace = true
mfn-code.workspace = true
inventory = "0.3.24"
tempfile = "3.27.0"
