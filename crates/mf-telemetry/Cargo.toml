[package]
name = "mf-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Versioned workflow observation contracts for miniflow"

[features]
default = []
snapshot = ["dep:opentelemetry-proto", "dep:prost"]
otlp = ["snapshot", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:reqwest"]

[dependencies]
opentelemetry = { version = "0.33.0", default-features = false, features = ["logs", "trace"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["logs", "trace"], optional = true }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["logs", "trace", "http-proto", "reqwest-blocking-client"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
snafu = "0.9.2"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

opentelemetry-proto = { version = "0.33.0", default-features = false, features = ["gen-tonic-messages", "logs"], optional = true }
prost = { version = "0.14.4", optional = true }
