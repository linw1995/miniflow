[package]
name = "mf-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Versioned workflow observation contracts for miniflow"

[features]
default = []
snapshot = ["dep:opentelemetry-proto", "dep:prost"]
otlp = ["snapshot", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:reqwest"]

[dependencies]
# Observation APIs and wire contracts.
opentelemetry = { workspace = true, features = ["logs", "trace"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
snafu.workspace = true

# Workflow hashes, snapshot integrity, and run identifiers.
sha2.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }

# Snapshot protobuf encoding, enabled by the snapshot feature.
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "logs"], optional = true }
prost = { workspace = true, optional = true }

# OTLP export over HTTPS, enabled by the otlp feature.
opentelemetry-otlp = { workspace = true, features = ["logs", "trace", "http-proto", "reqwest-blocking-client"], optional = true }
opentelemetry_sdk = { workspace = true, features = ["logs", "trace"], optional = true }
reqwest = { workspace = true, features = ["blocking", "rustls"], optional = true }
