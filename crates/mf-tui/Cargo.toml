[package]
name = "mf-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal observation of locally launched miniflow workflows"

[dependencies]
# Runtime state and snapshot contracts.
mf-runtime.workspace = true
mf-telemetry = { workspace = true, features = ["snapshot"] }

# Terminal input, rendering, and workflow graph layout.
crossterm.workspace = true
ratatui = { workspace = true, features = ["crossterm", "unstable-rendered-line-info"] }
rust-sugiyama.workspace = true

# Local OTLP HTTP receiver and protobuf decoding.
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "logs", "trace"] }
prost.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }

# Runner process control, signal handling, and output buffering.
nix = { workspace = true, features = ["fs", "signal", "process"] }
process-wrap = { workspace = true, features = ["std", "process-group", "job-object"] }
signal-hook.workspace = true
tempfile.workspace = true
object.workspace = true

# Snapshot values, integrity checks, and diagnostics.
serde_json.workspace = true
sha2.workspace = true
snafu.workspace = true

[target.'cfg(unix)'.dependencies]
# Terminal size queries.
rustix = { workspace = true, features = ["termios"] }
