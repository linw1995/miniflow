[package]
name = "mf-chat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Persistent multi-session chat through embedded miniflow workflows"

[dependencies]
# Application node contracts and host-side workflow preparation.
mf-runtime.workspace = true
mf-telemetry.workspace = true
mf-compiler.workspace = true
mfn-llm.workspace = true
mfn-code.workspace = true
mfn-core.workspace = true
inventory.workspace = true

# Portable database storage and migrations.
diesel = { workspace = true, features = ["sqlite", "32-column-tables"] }
diesel_migrations.workspace = true
libsqlite3-sys = { workspace = true, features = ["bundled"] }
fs2.workspace = true

# Typed values and diagnostics.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
snafu.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# Capture application and nested Flow lifecycle records.
opentelemetry = { workspace = true, features = ["logs", "trace"] }
opentelemetry_sdk = { workspace = true, features = ["logs", "trace", "testing"] }

# Built-in node fixtures.
mfn-llm = { workspace = true, features = ["test-support"] }

# Isolated databases and packaging fixtures.
tempfile.workspace = true
toml.workspace = true

[build-dependencies]
# Bind shipped Flow provider dependencies at build time.
serde_json.workspace = true
snafu.workspace = true
