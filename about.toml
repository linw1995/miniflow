# Desktop probe review: package-scoped additions, not global license approvals.
# Reviewed versions: cbindgen 0.28.0, option-ext 0.2.0, libbz2-rs-sys 0.2.6.
[cbindgen]
accepted = ["MPL-2.0"]

[option-ext]
accepted = ["MPL-2.0"]

[libbz2-rs-sys]
accepted = ["bzip2-1.0.6"]

# Ely 5d6efd46ec0c93b381ec7578561a1273c366025b embeds these resources.
