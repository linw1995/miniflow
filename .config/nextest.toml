nextest-version = { required = "0.9.145" }
experimental = ["setup-scripts"]

[test-groups.shared-cargo]
max-threads = 1

[scripts.setup.package-dependencies]
command = ["cargo", "fetch", "--locked"]
capture-stdout = true
capture-stderr = true

[scripts.setup.build-cache]
command = ["python3", "scripts/nextest-build-cache.py"]
capture-stdout = true
capture-stderr = true

[[profile.default.scripts]]
platform = 'cfg(unix)'
# Keep this selection identical to the shared-cargo override below.
filter = '''
(binary_id(=mf-cli::compile) & (
    test(=compiled_binary_replaces_target_and_runs_without_the_definition) |
    test(=warm_build_preserves_generated_inputs_and_reuses_compiled_runner) |
    test(=cargo_invalidates_features_local_sources_and_flags) |
    test(=failed_validation_preserves_prior_lock_and_executable) |
    test(=install_failure_reports_persisted_lock_and_preserves_existing_directory) |
    test(=invalid_input_port_reports_both_edge_endpoints) |
    test(=invalid_output_port_reports_both_edge_endpoints) |
    test(=repairs_partial_projects_and_updates_configuration) |
    test(=unknown_plugin_reports_node_and_kind)
)) |
(binary_id(=mf-cli::packaged_cli) & test(=packaged_cli_acceptance)) |
(binary_id(=mf-cli::examples) &
    test(=documented_examples_compile_and_produce_expected_outputs)) |
(binary_id(=mf-compiler::runner_validation) &
    test(=build_validates_without_execution_and_reports_plugin_errors)) |
(binary_id(=mf-compiler::typed_fast_paths) &
    test(=generated_owned_values_preserve_contracts_and_installation)) |
(binary_id(=mf-compiler::struct_inputs) &
    test(=generated_struct_inputs_match_memory_and_freeze_the_interface)) |
(binary_id(=mf-compiler::typed_ports) & (
    test(=generated_runner_matches_memory_for_checked_connections) |
    test(=skipped_typed_inputs_match_in_memory_and_generated_execution)
)) |
(binary_id(=mf-compiler::inferred_runner) & (
    test(=generated_runner_matches_inference_and_preserves_installed_binary_on_conflict) |
    test(=generated_runner_rejects_a_false_output_derivation)
)) |
(binary_id(=mf-compiler::observation) &
    test(=generated_execution_matches_memory_for_success_and_failures)) |
(binary_id(=mf-cli::runner_observability) &
    test(=generated_runner_describes_embedded_graph_and_exports_correlated_otel)) |
(binary_id(=mf-cli::stream_tui) &
    test(=generated_streams_run_in_tui_with_parameters_files_and_interrupts)) |
(binary_id(=mf-compiler::if_else) &
    test(=compiled_branches_match_memory_and_rebuild_when_precedence_changes))
'''
setup = "build-cache"

[[profile.default.scripts]]
platform = 'cfg(unix)'
filter = 'binary_id(=mf-cli::packaged_cli) & test(=packaged_cli_acceptance)'
setup = "package-dependencies"

[[profile.default.overrides]]
platform = 'cfg(unix)'
# Serialize generated builds that share the prewarmed Cargo target.
filter = '''
(binary_id(=mf-cli::compile) & (
    test(=compiled_binary_replaces_target_and_runs_without_the_definition) |
    test(=warm_build_preserves_generated_inputs_and_reuses_compiled_runner) |
    test(=cargo_invalidates_features_local_sources_and_flags) |
    test(=failed_validation_preserves_prior_lock_and_executable) |
    test(=install_failure_reports_persisted_lock_and_preserves_existing_directory) |
    test(=invalid_input_port_reports_both_edge_endpoints) |
    test(=invalid_output_port_reports_both_edge_endpoints) |
    test(=repairs_partial_projects_and_updates_configuration) |
    test(=unknown_plugin_reports_node_and_kind)
)) |
(binary_id(=mf-cli::packaged_cli) & test(=packaged_cli_acceptance)) |
(binary_id(=mf-cli::examples) &
    test(=documented_examples_compile_and_produce_expected_outputs)) |
(binary_id(=mf-compiler::runner_validation) &
    test(=build_validates_without_execution_and_reports_plugin_errors)) |
(binary_id(=mf-compiler::typed_fast_paths) &
    test(=generated_owned_values_preserve_contracts_and_installation)) |
(binary_id(=mf-compiler::struct_inputs) &
    test(=generated_struct_inputs_match_memory_and_freeze_the_interface)) |
(binary_id(=mf-compiler::typed_ports) & (
    test(=generated_runner_matches_memory_for_checked_connections) |
    test(=skipped_typed_inputs_match_in_memory_and_generated_execution)
)) |
(binary_id(=mf-compiler::inferred_runner) & (
    test(=generated_runner_matches_inference_and_preserves_installed_binary_on_conflict) |
    test(=generated_runner_rejects_a_false_output_derivation)
)) |
(binary_id(=mf-compiler::observation) &
    test(=generated_execution_matches_memory_for_success_and_failures)) |
(binary_id(=mf-cli::runner_observability) &
    test(=generated_runner_describes_embedded_graph_and_exports_correlated_otel)) |
(binary_id(=mf-cli::stream_tui) &
    test(=generated_streams_run_in_tui_with_parameters_files_and_interrupts)) |
(binary_id(=mf-compiler::if_else) &
    test(=compiled_branches_match_memory_and_rebuild_when_precedence_changes))
'''
# Protect the shared runner until validation, installation, and execution finish.
test-group = "shared-cargo"

[[profile.default.overrides]]
filter = 'test(=packaged_cli_acceptance)'
# The acceptance test performs several Cargo builds in isolated directories.
threads-required = "num-test-threads"
slow-timeout = { period = "60s", terminate-after = 20 }

[profile.ci]
inherits = "default"

# Reuse the shared target for more generated builds on constrained CI workers.
[[profile.ci.scripts]]
platform = 'cfg(unix)'
filter = '''
(binary_id(=mf-cli::compile) & (
    test(=development_support_uses_checkout_crates_without_override) |
    test(=compiles_a_runner_without_telemetry_and_preserves_execution)
)) |
(binary_id(=mf-cli::runner_observability) & (
    test(=generated_loop_runner_exports_complete_per_pass_observations) |
    test(=streaming_runner_exports_message_lifecycles_without_changing_results)
)) |
(binary_id(=mf-compiler::stream_runner) &
    test(=generated_streams_preserve_protocol_boundaries_and_installation_guarantees)) |
(binary_id(=mf-compiler::stream_parity) &
    test(=generated_preparation_matches_memory_under_the_same_clock_and_inputs)) |
(binary_id(=mf-compiler::stream_producer_runner) &
    test(=external_line_producer_matches_memory_and_drains_after_stdin_closes)) |
(binary_id(=mf-compiler::startup_runner) &
    test(=standalone_sources_describe_parameters_and_run_without_stdin_or_build_inputs)) |
(binary_id(=mf-compiler::workflow_inputs) &
    test(=generated_tasks_share_startup_binding_and_validation)) |
(binary_id(=mf-compiler::code_validation) &
    test(=build_rejects_inactive_code_without_replacing_output)) |
(binary_id(=mf-compiler::loop_planning) & (
    test(=generated_loop_matches_in_memory_without_build_inputs) |
    test(=invalid_loop_edit_preserves_installed_binary_and_lock)
)) |
(binary_id(=mf-compiler::iteration) & (
    test(=generated_parallel_runner_matches_in_memory_and_describes_one_iteration_node) |
    test(=loop_and_iteration_share_a_workflow_in_memory_and_generated_runners)
)) |
(binary_id(=mf-cli::manifest) &
    test(=moved_task_stream_and_nested_runners_keep_manifest_and_execution_contracts)) |
(binary_id(=mf-compiler::interface_agreement) &
    test(=generated_task_and_stream_runners_reject_runtime_contract_changes_before_dispatch)) |
(binary_id(=mf-cli::manifest) &
    test(=release_lto_and_strip_preserve_standalone_factory_free_manifest))
'''
setup = "build-cache"

[[profile.ci.overrides]]
