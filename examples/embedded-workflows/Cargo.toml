[package]
name = "embedded-workflows"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[dependencies]
mf-compiler = { path = "../../crates/mf-compiler", default-features = false }
mf-runtime = { path = "../../crates/mf-runtime" }
core_nodes = { package = "mfn-core", path = "../../crates/builtin-nodes/core" }
serde_json = "1.0.151"

[build-dependencies]
mf-compiler = { path = "../../crates/mf-compiler", default-features = false, features = ["codegen"] }
