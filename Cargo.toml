[workspace]
members = ["crates/mf-*", "crates/builtin-nodes/*"]
default-members = ["crates/mf-cli"]
resolver = "3"

# Embedded chat integration runs credential-isolated host subprocesses.
[[workspace.metadata.affected.rule]]
globs = [
    "crates/mf-chat/src/**/*.rs",
    "crates/mf-runtime/src/**/*.rs",
    "crates/mf-compiler/src/**/*.rs",
    "crates/builtin-nodes/llm/src/**/*.rs",
]
filterset = "package(=mf-chat) & kind(test)"

# Coverage of test binaries cannot observe CLI and generated-runner subprocesses.
[[workspace.metadata.affected.rule]]
globs = ["crates/mf-cli/src/**/*.rs", "crates/mf-tui/src/**/*.rs"]
filterset = "package(=mf-cli) & kind(test)"

[[workspace.metadata.affected.rule]]
globs = [
    "crates/mf-compiler/src/**/*.rs",
    "crates/mf-runtime/src/**/*.rs",
    "crates/mf-telemetry/src/**/*.rs",
    "crates/builtin-nodes/*/src/**/*.rs",
]
filterset = "(package(=mf-cli) | package(=mf-compiler)) & kind(test)"

[[workspace.metadata.affected.rule]]
globs = ["crates/mf-runtime/src/**/*.rs"]
filterset = "binary_id(=mf-runtime::input_derive_compile)"

# Exact external inputs are also the full-suite fallback allowlist.
[[workspace.metadata.affected.rule]]
globs = ["crates/mf-compiler/tests/fixtures/controlled_source.rs"]
filterset = "package(=mf-compiler) & binary(/^(batch|stream_capacity|stream_execution|stream_observation|stream_parity|stream_planning|stream_producer|stream_producer_runner|subgraph_workers)$/)"

[[workspace.metadata.affected.rule]]
globs = ["crates/mf-compiler/tests/fixtures/observation_capture.rs"]
filterset = "package(=mf-compiler) & binary(/^(iteration|loop_planning|observation|single_node_execution|stream_cancellation|stream_observation|stream_producer|embedding_host)$/)"

[[workspace.metadata.affected.rule]]
globs = ["crates/mf-compiler/tests/fixtures/event_collector.rs"]
filterset = "package(=mf-compiler) & binary(/^(stream_capacity|stream_execution)$/)"

[[workspace.metadata.affected.rule]]
globs = ["crates/mf-compiler/tests/fixtures/stream_driver.rs"]
filterset = "package(=mf-compiler) & binary(/^(stream_parity)$/)"

[[workspace.metadata.affected.rule]]
globs = [
    "crates/mf-compiler/tests/fixtures/multi-nodes/.gitignore",
    "crates/mf-compiler/tests/fixtures/multi-nodes/Cargo.toml",
    "crates/mf-compiler/tests/fixtures/multi-nodes/examples/registrations.rs",
    "crates/mf-compiler/tests/fixtures/multi-nodes/src/context_fixture.rs",
    "crates/mf-compiler/tests/fixtures/multi-nodes/src/generated_fixture.rs",
    "crates/mf-compiler/tests/fixtures/multi-nodes/src/interface_fixture.rs",
    "crates/mf-compiler/tests/fixtures/multi-nodes/src/lib.rs",
    "crates/mf-compiler/tests/fixtures/multi-nodes/src/line_producer.rs",
    "crates/mf-compiler/tests/fixtures/multi-nodes/src/stream_fixture.rs",
    "crates/mf-compiler/tests/fixtures/multi-nodes/src/struct_inputs.rs",
    "crates/mf-compiler/tests/fixtures/multi-nodes/src/typed_fixture.rs",
]
filterset = "(package(=mf-cli) | package(=mf-compiler)) & kind(test)"

[[workspace.metadata.affected.rule]]
globs = [
    "crates/mf-telemetry/tests/fixtures/node-started.json",
    "crates/mf-telemetry/tests/fixtures/node-succeeded.json",
    "crates/mf-telemetry/tests/fixtures/preparation-failed.json",
]
filterset = "package(=mf-telemetry)"

[[workspace.metadata.affected.rule]]
globs = [
    "crates/mf-telemetry/tests/fixtures/description.json",
    "crates/mf-telemetry/tests/fixtures/identity-digest.txt",
    "crates/mf-telemetry/tests/fixtures/identity-input.json",
    "crates/mf-telemetry/tests/fixtures/node-skipped.json",
    "crates/mf-telemetry/tests/fixtures/workflow-failed.json",
    "crates/mf-telemetry/tests/fixtures/workflow-started.json",
    "crates/mf-telemetry/tests/fixtures/workflow-succeeded.json",
]
filterset = "binary_id(=mf-telemetry::contracts)"

[[workspace.metadata.affected.rule]]
globs = ["examples/cel-scalar.json"]
filterset = "binary_id(=mf-cli::examples)"

[[workspace.metadata.affected.rule]]
globs = ["examples/cel-list.json"]
filterset = "binary_id(=mf-cli::examples) | binary_id(=mf-cli::packaged_cli)"

[[workspace.metadata.affected.rule]]
globs = [
    "examples/if-else.json",
    "examples/else-if.json",
]
filterset = "binary_id(=mf-cli::examples) | binary_id(=mf-compiler::if_else)"

[[workspace.metadata.affected.rule]]
globs = ["examples/hello-workflow.json"]
filterset = "binary_id(=mf-cli::examples) | binary_id(=mf-compiler::workflow_definition)"

[[workspace.metadata.affected.rule]]
globs = ["examples/iteration.json"]
filterset = "binary_id(=mf-cli::examples) | (package(=mf-compiler) & binary(/^(iteration|embedding_host)$/))"

[[workspace.metadata.affected.rule]]
globs = ["examples/loop.json"]
filterset = "binary_id(=mf-cli::examples) | binary_id(=mf-cli::manifest) | binary_id(=mf-cli::packaged_cli) | (package(=mf-compiler) & binary(/^(iteration|single_node_execution|embedding_host)$/))"

[[workspace.metadata.affected.rule]]
globs = [
    "examples/llm-loop.json",
    "examples/llm-terminal.json",
]
filterset = "binary_id(=mf-cli::examples) | binary_id(=mf-compiler::llm_workflows)"

[[workspace.metadata.affected.rule]]
globs = ["examples/stream-batch.json"]
filterset = "binary_id(=mf-cli::examples) | binary_id(=mf-cli::runner_observability) | binary_id(=mf-compiler::batch) | binary_id(=mf-compiler::stream_observation) | binary_id(=mf-compiler::stream_runner)"

[[workspace.metadata.affected.rule]]
globs = [
    "crates/mf-compiler/tests/fixtures/embedding-host/Cargo.template.toml",
    "crates/mf-compiler/tests/fixtures/embedding-host/answer.json",
    "crates/mf-compiler/tests/fixtures/embedding-host/build.rs",
    "crates/mf-compiler/tests/fixtures/embedding-host/contract-stream.json",
    "crates/mf-compiler/tests/fixtures/embedding-host/contract.json",
    "crates/mf-compiler/tests/fixtures/embedding-host/counter.json",
    "crates/mf-compiler/tests/fixtures/embedding-host/events.json",
    "crates/mf-compiler/tests/fixtures/embedding-host/src/main.rs",
    "crates/mf-compiler/tests/fixtures/embedding-host/typed.json",
    "crates/mf-compiler/tests/fixtures/embedding_stateful.rs",
    "examples/embedded-workflows/Cargo.toml",
    "examples/embedded-workflows/answer.json",
    "examples/embedded-workflows/build.rs",
    "examples/embedded-workflows/src/main.rs",
]
filterset = "binary_id(=mf-compiler::embedding_host)"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/linw1995/miniflow"

[workspace.dependencies]
# Keep versions and default-feature policy here; crates select features and optionality.

# Workspace crates.
mf-chat = { path = "crates/mf-chat", version = "0.1.0" }
mf-compiler = { path = "crates/mf-compiler", version = "0.1.0", default-features = false }
mf-runtime = { path = "crates/mf-runtime", version = "0.1.0" }
mf-runtime-derive = { path = "crates/mf-runtime-derive", version = "0.1.0" }
mf-telemetry = { path = "crates/mf-telemetry", version = "0.1.0", default-features = false }
mf-tui = { path = "crates/mf-tui", version = "0.1.0" }
mfn-code = { path = "crates/builtin-nodes/code", version = "0.1.0" }
mfn-core = { path = "crates/builtin-nodes/core", version = "0.1.0" }
mfn-llm = { path = "crates/builtin-nodes/llm", version = "0.1.0" }

# Serialization and error reporting.
serde = "1.0.229"
serde_json = "1.0.151"
snafu = "0.9.2"

# Node registration, expressions, and persistent runtime state.
cel-core = "=0.5.1"
inventory = "0.3.24"
rpds = "1.2.1"

# Application database storage and ownership.
diesel = { version = "2.3.12", default-features = false }
diesel_migrations = "2.3.2"
libsqlite3-sys = "0.37.0"
fs2 = "0.4.3"

# Rust code generation.
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", default-features = false }

# Telemetry APIs, exporters, and protobuf messages.
opentelemetry = { version = "0.33.0", default-features = false }
opentelemetry-otlp = { version = "0.33.0", default-features = false }
opentelemetry-proto = { version = "0.33.0", default-features = false }
opentelemetry_sdk = { version = "0.33.0", default-features = false }
prost = "0.14.4"

# Async execution and HTTP transport.
bytes = "1.12.1"
futures = { version = "0.3.34", default-features = false }
futures-timer = "3.0.4"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
rig-core = { version = "=0.43.0", default-features = false }
rig-reqwest = { version = "=0.43.0", default-features = false }
tokio = { version = "1.53.1", default-features = false }
url = "2.5.8"

# Command parsing, terminal rendering, and graph layout.
clap = "4.6.7"
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false }
rust-sugiyama = "0.4.0"

# Process control, signals, and terminal I/O.
libc = "0.2.189"
nix = "0.31.3"
process-wrap = { version = "10.0.1", default-features = false }
rustix = "1.1.5"
signal-hook = "0.4.4"

# Content hashes and run identifiers.
sha2 = "0.11.0"
uuid = "1.26.1"

# Package archives and temporary files.
flate2 = "1.1.10"
tar = "0.4.46"
tempfile = "3.27.0"

# Executable metadata inspection.
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "macho", "std"] }
