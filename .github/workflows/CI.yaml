name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number for cumulative validation (empty runs the full suite)"
        type: string
        default: ""
      merge_sha:
        description: "Exact tested PR merge SHA; dispatch on the PR branch"
        type: string
        default: ""
  push:
    branches:
      - main

env:
  PR_COVERAGE_TARGET: "95"

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - uses: ./.github/actions/setup-nix
        with:
          cache-key-name: environment
          cache-source: "false"
      - name: Run repository hooks
        run: |
          # Flake checks cover Rust formatting, compilation, Clippy, and workflows.
          # The Nix package build also generates and validates third-party notices.
          nix develop --command prek -a \
            --skip fmt \
            --skip clippy \
            --skip cargo-check \
            --skip actionlint \
            --skip third-party-notices
      - name: Check CI scripts
        run: |
          nix develop --command python3 -m unittest discover -s scripts -p 'test_*.py'
          nix develop --command python3 -m unittest discover -s tools/test-affected -p test_runner.py
      - name: Warm planning cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/setup-test-planner

  check:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest", "macos-14"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - uses: ./.github/actions/setup-nix
      - name: Check formatting and workflows
        if: matrix.runner == 'ubuntu-latest'
        run: |
          nix build --no-link -L \
            '.#checks.x86_64-linux.fmt' \
            '.#checks.x86_64-linux.workflows'
      - name: Build package and run Clippy
        if: matrix.runner == 'ubuntu-latest'
        run: |
          nix build --no-link -L \
            '.#checks.x86_64-linux.miniflow' \
            '.#checks.x86_64-linux.clippy'
      - name: Build package and check macOS
        if: matrix.runner == 'macos-14'
        run: |
          nix build --no-link -L \
            '.#checks.aarch64-darwin.miniflow' \
            '.#checks.aarch64-darwin.clippy' \
            '.#checks.aarch64-darwin.fmt' \
            '.#checks.aarch64-darwin.workflows'

  coverage:
    runs-on: ubuntu-latest
    env:
      NEXTEST_PROFILE: ci
      MF_COVERAGE_REPORT_FORMAT: ${{ (github.event_name == 'pull_request' || inputs.pr != '') && 'lcov' || 'full' }}
      MF_TEST_BUILD_CACHE_DIR: ${{ github.workspace }}/target/coverage-fixtures
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
        with:
          cache-key-name: environment
          cache-source: "false"
      - name: Prepare planning Flow
        if: github.event_name == 'pull_request' || inputs.pr != ''
        uses: ./.github/actions/setup-test-planner
      - name: Select incremental PR tests
        id: selection
        if: github.event_name == 'pull_request' || inputs.pr != ''
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          MF_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          MF_PR_BRANCH: ${{ github.head_ref || github.ref_name }}
          MF_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MF_MERGE_SHA: ${{ inputs.merge_sha }}
          MF_COVERAGE_TARGET: ${{ env.PR_COVERAGE_TARGET }}
        run: |
          nix develop --command bash -euo pipefail <<'SCRIPT'
            MF_TOOLCHAIN="$(rustc -vV)"
            export MF_TOOLCHAIN
            mkdir -p "$RUNNER_TEMP/pr-validation"
            target/test-affected-ci/bin/mf run ./target/test-affected-ci/bin/runner \
              --params.ci true --params.repository "$PWD" > "$RUNNER_TEMP/pr-validation/flow.json"
            python3 scripts/pr_validation.py accept --flow-output "$RUNNER_TEMP/pr-validation/flow.json" \
              --directory "$RUNNER_TEMP/pr-validation" --coverage-target "$PR_COVERAGE_TARGET"
          SCRIPT
      - name: Cache coverage dependencies
        if: steps.selection.outputs.scoped != 'true' || steps.selection.outputs.run == 'true'
        uses: ./.github/actions/cache-coverage
        with:
          plan: ${{ steps.selection.outputs.scoped == 'true' && format('{0}/pr-validation/plan.json', runner.temp) || '' }}
      - name: Prepare and build coverage tests
        id: prepared
        if: steps.selection.outputs.scoped != 'true' || steps.selection.outputs.run == 'true'
        env:
          SCOPED_VALIDATION: ${{ steps.selection.outputs.scoped }}
          # Only default-branch pushes collect and publish the coverage graph.
          PUBLISH_COVERAGE_GRAPH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [[ "$SCOPED_VALIDATION" == "true" ]]; then
            nix develop --command bash scripts/run-cov.sh --prepare --affected-plan "$RUNNER_TEMP/pr-validation/plan.json"
          elif [[ "$PUBLISH_COVERAGE_GRAPH" == "true" ]]; then
            nix develop --command bash scripts/run-cov.sh --coverage-graph target/coverage/graph/graph.sqlite --prepare
          else
            nix develop --command bash scripts/run-cov.sh --prepare
          fi
      - name: Coverage tests (mf-chat)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.prepared.outputs.packages || '[]'), 'mf-chat')
        run: nix develop --command bash scripts/run-cov.sh --test-package mf-chat
      - name: Coverage tests (mf-cli)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.prepared.outputs.packages || '[]'), 'mf-cli')
        run: nix develop --command bash scripts/run-cov.sh --test-package mf-cli
      - name: Coverage tests (mf-compiler)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.prepared.outputs.packages || '[]'), 'mf-compiler')
        run: nix develop --command bash scripts/run-cov.sh --test-package mf-compiler
      - name: Coverage tests (mf-runtime)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.prepared.outputs.packages || '[]'), 'mf-runtime')
        run: nix develop --command bash scripts/run-cov.sh --test-package mf-runtime
      - name: Coverage tests (mf-runtime-derive)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.prepared.outputs.packages || '[]'), 'mf-runtime-derive')
        run: nix develop --command bash scripts/run-cov.sh --test-package mf-runtime-derive
      - name: Coverage tests (mf-telemetry)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.prepared.outputs.packages || '[]'), 'mf-telemetry')
        run: nix develop --command bash scripts/run-cov.sh --test-package mf-telemetry
      - name: Coverage tests (mf-tui)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.prepared.outputs.packages || '[]'), 'mf-tui')
        run: nix develop --command bash scripts/run-cov.sh --test-package mf-tui
      - name: Coverage tests (mfn-code)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.prepared.outputs.packages || '[]'), 'mfn-code')
        run: nix develop --command bash scripts/run-cov.sh --test-package mfn-code
      - name: Coverage tests (mfn-core)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.prepared.outputs.packages || '[]'), 'mfn-core')
        run: nix develop --command bash scripts/run-cov.sh --test-package mfn-core
      - name: Coverage tests (mfn-llm)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.prepared.outputs.packages || '[]'), 'mfn-llm')
        run: nix develop --command bash scripts/run-cov.sh --test-package mfn-llm
      - name: Coverage tests (mfn-test-affected)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.prepared.outputs.packages || '[]'), 'mfn-test-affected')
        run: nix develop --command bash scripts/run-cov.sh --test-package mfn-test-affected
      - name: Generate coverage reports
        id: report
        if: steps.selection.outputs.scoped != 'true' || steps.selection.outputs.run == 'true'
        run: nix develop --command bash scripts/run-cov.sh --report
      - name: Check incremental coverage
        if: steps.selection.outputs.scoped == 'true'
        run: |
          nix develop --command python3 scripts/pr_validation.py evaluate \
            --directory "$RUNNER_TEMP/pr-validation"
      - name: Upload validation inputs
        if: steps.selection.outputs.scoped == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr-validation-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-validation/
          if-no-files-found: error
      - name: Prune coverage build cache
        if: steps.selection.outputs.scoped != 'true' || steps.selection.outputs.run == 'true'
        run: nix develop --command bash scripts/run-cov.sh --prune-cache
      - name: Upload coverage artifact
        if: always() && steps.report.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage/result/
          if-no-files-found: error
          overwrite: true
      - name: Upload coverage graph
        # Hard isolation: graph publication exists only for successful
        # default-branch push runs; PR and dispatch runs never collect it.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.report.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-graph-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/coverage/graph/
          if-no-files-found: error
      - name: Upload crate coverage (mf-chat)
        if: contains(fromJSON(steps.report.outputs.complete_packages || '[]'), 'mf-chat')
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/result/crates/mf-chat.lcov
          disable_search: true
          flags: mf-chat
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload crate coverage (mf-cli)
        if: contains(fromJSON(steps.report.outputs.complete_packages || '[]'), 'mf-cli')
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/result/crates/mf-cli.lcov
          disable_search: true
          flags: mf-cli
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload crate coverage (mf-compiler)
        if: contains(fromJSON(steps.report.outputs.complete_packages || '[]'), 'mf-compiler')
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/result/crates/mf-compiler.lcov
          disable_search: true
          flags: mf-compiler
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload crate coverage (mf-runtime)
        if: contains(fromJSON(steps.report.outputs.complete_packages || '[]'), 'mf-runtime')
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/result/crates/mf-runtime.lcov
          disable_search: true
          flags: mf-runtime
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload crate coverage (mf-runtime-derive)
        if: contains(fromJSON(steps.report.outputs.complete_packages || '[]'), 'mf-runtime-derive')
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/result/crates/mf-runtime-derive.lcov
          disable_search: true
          flags: mf-runtime-derive
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload crate coverage (mf-telemetry)
        if: contains(fromJSON(steps.report.outputs.complete_packages || '[]'), 'mf-telemetry')
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/result/crates/mf-telemetry.lcov
          disable_search: true
          flags: mf-telemetry
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload crate coverage (mf-tui)
        if: contains(fromJSON(steps.report.outputs.complete_packages || '[]'), 'mf-tui')
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/result/crates/mf-tui.lcov
          disable_search: true
          flags: mf-tui
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload crate coverage (mfn-code)
        if: contains(fromJSON(steps.report.outputs.complete_packages || '[]'), 'mfn-code')
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/result/crates/mfn-code.lcov
          disable_search: true
          flags: mfn-code
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload crate coverage (mfn-core)
        if: contains(fromJSON(steps.report.outputs.complete_packages || '[]'), 'mfn-core')
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/result/crates/mfn-core.lcov
          disable_search: true
          flags: mfn-core
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload crate coverage (mfn-llm)
        if: contains(fromJSON(steps.report.outputs.complete_packages || '[]'), 'mfn-llm')
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/result/crates/mfn-llm.lcov
          disable_search: true
          flags: mfn-llm
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload crate coverage (mfn-test-affected)
        if: contains(fromJSON(steps.report.outputs.complete_packages || '[]'), 'mfn-test-affected')
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/result/crates/mfn-test-affected.lcov
          disable_search: true
          flags: mfn-test-affected
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage to Codecov
        if: steps.selection.outputs.scoped != 'true'
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/result/lcov.info
          disable_search: true
          flags: rust
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  validation:
    if: always()
    needs: [lint, check, coverage]
    runs-on: ubuntu-latest
    env:
      VALIDATION_NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Require all validation jobs
        run: jq -e 'all(.[]; .result == "success")' <<< "$VALIDATION_NEEDS"
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request' || inputs.pr != ''
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 2
      - uses: actions/download-artifact@v8
        if: github.event_name == 'pull_request' || inputs.pr != ''
        with:
          name: pr-validation-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-validation/
      - name: Record successful PR validation
        if: github.event_name == 'pull_request' || inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pr_validation.py record --directory "$RUNNER_TEMP/pr-validation"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request' || inputs.pr != ''
        with:
          name: pr-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-validation/validation.json
          if-no-files-found: error
