name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cache-key-name: lint
      - name: Run repository hooks
        run: nix develop --command prek -a

  check:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Check and build
        run: nix flake check -L
