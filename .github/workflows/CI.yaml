name: CI

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_semantic_title.py --pr-title

  lint:
    needs: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cache-key-name: lint
      - name: Run repository hooks
        run: |
          # Flake checks cover Rust formatting, compilation, Clippy, and workflows.
          # The Nix package build also generates and validates third-party notices.
          nix develop --command prek -a \
            --skip fmt \
            --skip clippy \
            --skip cargo-check \
            --skip actionlint \
            --skip third-party-notices

  check:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest", "macos-14"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Check and build without tests
        if: matrix.runner == 'ubuntu-latest'
        run: |
          nix build --no-link -L \
            '.#checks.x86_64-linux.miniflow' \
            '.#checks.x86_64-linux.fmt' \
            '.#checks.x86_64-linux.clippy' \
            '.#checks.x86_64-linux.workflows'
      - name: Check and build
        if: matrix.runner == 'macos-14'
        run: nix flake check -L

  coverage:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cache-key-name: coverage
      - name: Run native coverage
        run: nix develop --command bash scripts/run-cov.sh
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage/result/
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/result/lcov.info
          flags: rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
