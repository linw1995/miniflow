name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cache-key-name: lint
      - name: Run repository hooks
        run: |
          # Flake checks cover Rust formatting, compilation, Clippy, and workflows.
          # The Nix package build also generates and validates third-party notices.
          nix develop --command prek -a \
            --skip fmt \
            --skip clippy \
            --skip cargo-check \
            --skip actionlint \
            --skip third-party-notices
      - name: Check CI scripts
        run: nix develop --command python3 -m unittest discover -s scripts -p 'test_*.py'

  check:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest", "macos-14"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Check formatting and workflows
        if: matrix.runner == 'ubuntu-latest'
        run: |
          nix build --no-link -L \
            '.#checks.x86_64-linux.fmt' \
            '.#checks.x86_64-linux.workflows'
      - name: Build package and run Clippy
        if: matrix.runner == 'ubuntu-latest'
        run: |
          nix build --no-link -L \
            '.#checks.x86_64-linux.miniflow' \
            '.#checks.x86_64-linux.clippy'
      - name: Build package and check macOS
        if: matrix.runner == 'macos-14'
        run: |
          nix build --no-link -L \
            '.#checks.aarch64-darwin.miniflow' \
            '.#checks.aarch64-darwin.clippy' \
            '.#checks.aarch64-darwin.fmt' \
            '.#checks.aarch64-darwin.workflows'

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
        with:
          cache-key-name: coverage
      - name: Select affected PR tests
        id: selection
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEST_HEAD_SHA: ${{ github.sha }}
        run: |
          nix develop --command python3 scripts/affected_tests.py \
            --base "$PR_BASE_SHA" --head "$TEST_HEAD_SHA" --json > "$RUNNER_TEMP/affected-tests.json"
          printf 'run=%s\n' "$(jq '.packages | length > 0' "$RUNNER_TEMP/affected-tests.json")" >> "$GITHUB_OUTPUT"
          printf 'coverage_flag=%s\n' "$(jq -r 'if .mode == "all" then "rust" else "rust-affected" end' "$RUNNER_TEMP/affected-tests.json")" >> "$GITHUB_OUTPUT"
          {
            echo '### Affected Rust tests'
            echo '```json'
            jq '{mode, packages, reasons, fallback_reasons}' "$RUNNER_TEMP/affected-tests.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cache coverage dependencies
        if: github.event_name != 'pull_request' || steps.selection.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: |
            target/coverage/build/debug
            target/coverage/build/.mf-coverage-identity
            target/coverage/build/nextest-build-cache/ci
          key: coverage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'flake.lock', 'scripts/run-cov.sh') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            coverage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'flake.lock', 'scripts/run-cov.sh') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-
            coverage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'flake.lock', 'scripts/run-cov.sh') }}-
            coverage-${{ runner.os }}-${{ runner.arch }}-
      - name: Run native coverage
        if: github.event_name != 'pull_request' || steps.selection.outputs.run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEXTEST_PROFILE: ci
          MF_TEST_BUILD_CACHE_DIR: ${{ github.workspace }}/target/coverage/build/nextest-build-cache/ci
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            nix develop --command bash scripts/run-cov.sh --affected-plan "$RUNNER_TEMP/affected-tests.json"
          else
            nix develop --command bash scripts/run-cov.sh
          fi
      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || steps.selection.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage/result/
          overwrite: true
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || steps.selection.outputs.run == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/result/lcov.info
          disable_search: true
          flags: ${{ steps.selection.outputs.coverage_flag || 'rust' }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
