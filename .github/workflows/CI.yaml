name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number for cumulative validation (empty runs the full suite)"
        type: string
        default: ""
      merge_sha:
        description: "Exact tested PR merge SHA; dispatch on the PR branch"
        type: string
        default: ""
  push:
    branches:
      - main

env:
  PR_COVERAGE_TARGET: "95"

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - uses: ./.github/actions/setup-nix
        with:
          cache-key-name: lint
      - name: Run repository hooks
        run: |
          # Flake checks cover Rust formatting, compilation, Clippy, and workflows.
          # The Nix package build also generates and validates third-party notices.
          nix develop --command prek -a \
            --skip fmt \
            --skip clippy \
            --skip cargo-check \
            --skip actionlint \
            --skip third-party-notices
      - name: Check CI scripts
        run: |
          nix develop --command python3 -m unittest discover -s scripts -p 'test_*.py'
          nix develop --command python3 -m unittest discover -s tools/test-affected -p test_runner.py

  check:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest", "macos-14"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - uses: ./.github/actions/setup-nix
      - name: Check formatting and workflows
        if: matrix.runner == 'ubuntu-latest'
        run: |
          nix build --no-link -L \
            '.#checks.x86_64-linux.fmt' \
            '.#checks.x86_64-linux.workflows'
      - name: Build package and run Clippy
        if: matrix.runner == 'ubuntu-latest'
        run: |
          nix build --no-link -L \
            '.#checks.x86_64-linux.miniflow' \
            '.#checks.x86_64-linux.clippy'
      - name: Build package and check macOS
        if: matrix.runner == 'macos-14'
        run: |
          nix build --no-link -L \
            '.#checks.aarch64-darwin.miniflow' \
            '.#checks.aarch64-darwin.clippy' \
            '.#checks.aarch64-darwin.fmt' \
            '.#checks.aarch64-darwin.workflows'

  coverage:
    runs-on: ubuntu-latest
    env:
      NEXTEST_PROFILE: ci
      MF_TEST_BUILD_CACHE_DIR: ${{ github.workspace }}/target/coverage/build/nextest-build-cache/ci
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
        with:
          cache-key-name: coverage
      - name: Select incremental PR tests
        id: selection
        if: github.event_name == 'pull_request' || inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nix develop --command python3 scripts/pr_validation.py select \
            --directory "$RUNNER_TEMP/pr-validation" --coverage-target "$PR_COVERAGE_TARGET"
      - name: Cache coverage dependencies
        if: steps.selection.outputs.scoped != 'true' || steps.selection.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: |
            target/coverage/build/debug
            target/coverage/build/.mf-coverage-identity
            target/coverage/build/nextest-build-cache/ci
          key: coverage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'flake.lock', 'scripts/run-cov.sh') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            coverage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'flake.lock', 'scripts/run-cov.sh') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-
            coverage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'flake.lock', 'scripts/run-cov.sh') }}-
            coverage-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare and build coverage tests
        if: steps.selection.outputs.scoped != 'true' || steps.selection.outputs.run == 'true'
        env:
          SCOPED_VALIDATION: ${{ steps.selection.outputs.scoped }}
        run: |
          if [[ "$SCOPED_VALIDATION" == "true" ]]; then
            nix develop --command bash scripts/run-cov.sh --prepare --affected-plan "$RUNNER_TEMP/pr-validation/plan.json"
          else
            nix develop --command bash scripts/run-cov.sh --prepare
          fi
      - name: Coverage tests (mf-chat)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.selection.outputs.packages || '[]'), 'mf-chat')
        run: nix develop --command bash scripts/run-cov.sh --test-package mf-chat
      - name: Coverage tests (mf-cli)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.selection.outputs.packages || '[]'), 'mf-cli')
        run: nix develop --command bash scripts/run-cov.sh --test-package mf-cli
      - name: Coverage tests (mf-compiler)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.selection.outputs.packages || '[]'), 'mf-compiler')
        run: nix develop --command bash scripts/run-cov.sh --test-package mf-compiler
      - name: Coverage tests (mf-runtime)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.selection.outputs.packages || '[]'), 'mf-runtime')
        run: nix develop --command bash scripts/run-cov.sh --test-package mf-runtime
      - name: Coverage tests (mf-runtime-derive)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.selection.outputs.packages || '[]'), 'mf-runtime-derive')
        run: nix develop --command bash scripts/run-cov.sh --test-package mf-runtime-derive
      - name: Coverage tests (mf-telemetry)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.selection.outputs.packages || '[]'), 'mf-telemetry')
        run: nix develop --command bash scripts/run-cov.sh --test-package mf-telemetry
      - name: Coverage tests (mf-tui)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.selection.outputs.packages || '[]'), 'mf-tui')
        run: nix develop --command bash scripts/run-cov.sh --test-package mf-tui
      - name: Coverage tests (mfn-code)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.selection.outputs.packages || '[]'), 'mfn-code')
        run: nix develop --command bash scripts/run-cov.sh --test-package mfn-code
      - name: Coverage tests (mfn-core)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.selection.outputs.packages || '[]'), 'mfn-core')
        run: nix develop --command bash scripts/run-cov.sh --test-package mfn-core
      - name: Coverage tests (mfn-llm)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.selection.outputs.packages || '[]'), 'mfn-llm')
        run: nix develop --command bash scripts/run-cov.sh --test-package mfn-llm
      - name: Coverage tests (mfn-lsp)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.selection.outputs.packages || '[]'), 'mfn-lsp')
        run: nix develop --command env MF_LSP_SMOKE_SERVER=rust-analyzer bash scripts/run-cov.sh --test-package mfn-lsp --run-ignored all
      - name: Coverage tests (mfn-test-affected)
        if: steps.selection.outputs.scoped != 'true' || contains(fromJSON(steps.selection.outputs.packages || '[]'), 'mfn-test-affected')
        run: nix develop --command bash scripts/run-cov.sh --test-package mfn-test-affected
      - name: Generate coverage reports
        id: report
        if: steps.selection.outputs.scoped != 'true' || steps.selection.outputs.run == 'true'
        run: nix develop --command bash scripts/run-cov.sh --report
      - name: Check incremental coverage
        if: steps.selection.outputs.scoped == 'true'
        run: |
          nix develop --command python3 scripts/pr_validation.py evaluate \
            --directory "$RUNNER_TEMP/pr-validation"
      - name: Upload validation inputs
        if: steps.selection.outputs.scoped == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr-validation-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-validation/
          if-no-files-found: error
      - name: Prune coverage build cache
        if: steps.selection.outputs.scoped != 'true' || steps.selection.outputs.run == 'true'
        run: nix develop --command bash scripts/run-cov.sh --prune-cache
      - name: Upload coverage artifact
        if: always() && steps.report.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage/result/
          if-no-files-found: error
          overwrite: true
      - name: Upload coverage to Codecov
        if: steps.selection.outputs.scoped != 'true'
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/result/lcov.info
          disable_search: true
          flags: rust
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  validation:
    if: always()
    needs: [lint, check, coverage]
    runs-on: ubuntu-latest
    env:
      VALIDATION_NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Require all validation jobs
        run: jq -e 'all(.[]; .result == "success")' <<< "$VALIDATION_NEEDS"
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request' || inputs.pr != ''
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 2
      - uses: actions/download-artifact@v8
        if: github.event_name == 'pull_request' || inputs.pr != ''
        with:
          name: pr-validation-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-validation/
      - name: Record successful PR validation
        if: github.event_name == 'pull_request' || inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pr_validation.py record --directory "$RUNNER_TEMP/pr-validation"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request' || inputs.pr != ''
        with:
          name: pr-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-validation/validation.json
          if-no-files-found: error
