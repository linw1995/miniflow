name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cache-key-name: lint
      - name: Run repository hooks
        run: |
          # Flake checks cover Rust formatting, compilation, Clippy, and workflows.
          # The Nix package build also generates and validates third-party notices.
          nix develop --command prek -a \
            --skip fmt \
            --skip clippy \
            --skip cargo-check \
            --skip actionlint \
            --skip third-party-notices
      - name: Check CI scripts
        run: nix develop --command python3 -m unittest discover -s scripts -p 'test_*.py'

  check:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest", "macos-14"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Check formatting and workflows
        if: matrix.runner == 'ubuntu-latest'
        run: |
          nix build --no-link -L \
            '.#checks.x86_64-linux.fmt' \
            '.#checks.x86_64-linux.workflows'
      - name: Build package and run Clippy
        if: matrix.runner == 'ubuntu-latest'
        run: |
          nix build --no-link -L \
            '.#checks.x86_64-linux.miniflow' \
            '.#checks.x86_64-linux.clippy'
      - name: Build package and check macOS
        if: matrix.runner == 'macos-14'
        run: |
          nix build --no-link -L \
            '.#checks.aarch64-darwin.miniflow' \
            '.#checks.aarch64-darwin.clippy' \
            '.#checks.aarch64-darwin.fmt' \
            '.#checks.aarch64-darwin.workflows'

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
        with:
          cache-key-name: coverage
      # PRs consume default-branch mappings without publishing replacements.
      - name: Restore affected-test baseline
        uses: actions/cache/restore@v6
        with:
          path: |
            target/affected/coverage.db
            target/affected/baseline.sha
          key: affected-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml', 'flake.nix', 'flake.lock', '!**/target/**') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            affected-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml', 'flake.nix', 'flake.lock', '!**/target/**') }}-
      - name: Cache coverage dependencies
        uses: actions/cache@v6
        with:
          path: |
            target/affected/build
            target/coverage/build/debug
            target/coverage/build/.mf-coverage-identity
            target/coverage/build/nextest-build-cache/ci
          key: coverage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'flake.lock', 'scripts/run-cov.sh') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            coverage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'flake.lock', 'scripts/run-cov.sh') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-
            coverage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'flake.lock', 'scripts/run-cov.sh') }}-
            coverage-${{ runner.os }}-${{ runner.arch }}-
      - name: Run affected tests and coverage
        id: coverage
        env:
          NEXTEST_PROFILE: ci
          MF_TEST_BUILD_CACHE_DIR: ${{ github.workspace }}/target/coverage/build/nextest-build-cache/ci
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            nix develop --command bash scripts/run-cov.sh --refresh-affected
            echo "baseline=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          nix develop --command bash scripts/run-cov.sh --affected
          if [[ -s target/coverage/result/lcov.info ]]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
            if jq -e '.selection.summary.mode == "full-suite-no-listing"' target/affected/report.json > /dev/null; then
              echo "full=true" >> "$GITHUB_OUTPUT"
              echo "flags=rust,rust-affected" >> "$GITHUB_OUTPUT"
            else
              echo "flags=rust-affected" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Save affected-test baseline
        if: steps.coverage.outputs.baseline == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            target/affected/coverage.db
            target/affected/baseline.sha
          key: affected-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml', 'flake.nix', 'flake.lock', '!**/target/**') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload test-selection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: affected-tests
          path: target/affected/report.json
          overwrite: true
      - name: Upload coverage artifact
        if: steps.coverage.outputs.report == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage/result/
          overwrite: true
      - name: Upload coverage to Codecov
        if: steps.coverage.outputs.report == 'true' && (github.event_name == 'pull_request' || steps.coverage.outputs.full == 'true')
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/result/lcov.info
          flags: ${{ steps.coverage.outputs.flags }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
