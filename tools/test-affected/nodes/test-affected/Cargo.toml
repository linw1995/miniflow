[package]
name = "mfn-test-affected"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Commit comparison and affected-test planning for repository development"

[dependencies]
# Node contracts, registration, and semantic evidence.
inventory.workspace = true
mf-runtime = { workspace = true, features = ["tokio"] }
mfn-lsp.workspace = true

# Comparison facts, test plans, and typed diagnostics.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
snafu.workspace = true

# Bounded platform reads and artifact decoding.
reqwest = { workspace = true, features = ["rustls", "query"] }
url.workspace = true
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }

# Owned processes and bounded input/output transport.
libc.workspace = true
tempfile.workspace = true

# Rust source ownership and isolated test-body analysis.
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote.workspace = true
syn = { workspace = true, features = ["full", "parsing", "printing", "visit"] }

# Per-commit test coverage graph storage.
diesel = { workspace = true, features = ["sqlite"] }
diesel_migrations.workspace = true
libsqlite3-sys = { workspace = true, features = ["bundled"] }

# Coverage graph indexing command line.
clap = { workspace = true, features = ["derive"] }

[[bin]]
name = "coverage-graph"
path = "src/bin/coverage-graph.rs"
# The command is an indexing tool, not a test target; keep it out of the
# nextest inventory so package filters and coverage selection stay unchanged.
test = false
bench = false

[dev-dependencies]
# Compiled and in-memory Flow verification.
mf-compiler = { workspace = true, features = ["codegen"] }
mfn-code.workspace = true
mfn-core.workspace = true
